<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - Free Online Tool</title>

    <meta name="description"
        content="Calculate your exact age in years, months and days with our free online age calculator.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172033;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .date-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd3df;
            border-radius: 9px;
            font-size: 18px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .date-input:focus {
            border-color: #1769ff;
        }

        .hint {
            color: #667085;
            font-size: 13px;
            margin-top: 7px;
            text-align: center;
        }

        .calculate {
            width: 100%;
            border: none;
            background: #1769ff;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }

        .calculate:hover {
            background: #0757df;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f5f8ff;
            border-radius: 12px;
            text-align: center;
        }

        .age-main {
            font-size: 30px;
            font-weight: bold;
            color: #1769ff;
            margin-bottom: 15px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail {
            background: white;
            padding: 15px 5px;
            border-radius: 10px;
        }

        .detail strong {
            display: block;
            font-size: 22px;
        }

        .detail span {
            color: #667085;
            font-size: 13px;
        }

        .error {
            display: none;
            color: #d92d20;
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769ff;
            text-decoration: none;
        }

        @media (max-width: 480px) {

            .container {
                margin: 10px auto;
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }

            .date-input {
                font-size: 17px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎂 Age Calculator</h1>

    <p class="description">
        Calculate your exact age in years, months and days.
    </p>

    <div class="input-group">

        <label for="birthDate">
            Date of Birth
        </label>

        <input
            type="text"
            id="birthDate"
            class="date-input"
            placeholder="DD/MM/YYYY"
            inputmode="numeric"
            maxlength="10"
            autocomplete="bday"
        >

        <p class="hint">
            Example: 25/08/1998
        </p>

        <p
            class="error"
            id="errorMessage"
        >
        </p>

    </div>

    <button
        class="calculate"
        onclick="calculateAge()"
    >
        🧮 Calculate Age
    </button>

    <div
        class="result"
        id="result"
    >

        <div
            class="age-main"
            id="ageMain"
        >
        </div>

        <div class="details">

            <div class="detail">
                <strong id="years">0</strong>
                <span>Years</span>
            </div>

            <div class="detail">
                <strong id="months">0</strong>
                <span>Months</span>
            </div>

            <div class="detail">
                <strong id="days">0</strong>
                <span>Days</span>
            </div>

        </div>

    </div>

    <a
        class="back"
        href="../index.html"
    >
        ← Back to All Tools
    </a>

</div>


<script>

const birthInput =
    document.getElementById("birthDate");


/* Automatically add / while typing */
birthInput.addEventListener(
    "input",
    function () {

        let value =
            birthInput.value.replace(
                /\D/g,
                ""
            );

        if (value.length > 8) {
            value = value.substring(0, 8);
        }

        if (value.length >= 5) {

            value =
                value.substring(0, 2) +
                "/" +
                value.substring(2, 4) +
                "/" +
                value.substring(4);

        }
        else if (value.length >= 3) {

            value =
                value.substring(0, 2) +
                "/" +
                value.substring(2);

        }

        birthInput.value = value;

    }
);


function showError(message) {

    const error =
        document.getElementById(
            "errorMessage"
        );

    error.textContent =
        message;

    error.style.display =
        "block";

    document.getElementById(
        "result"
    ).style.display =
        "none";
}


function calculateAge() {

    const input =
        birthInput.value.trim();


    if (!input) {

        showError(
            "Please enter your date of birth."
        );

        return;
    }


    const parts =
        input.split("/");


    if (
        parts.length !== 3 ||
        parts[0].length !== 2 ||
        parts[1].length !== 2 ||
        parts[2].length !== 4
    ) {

        showError(
            "Please enter date in DD/MM/YYYY format."
        );

        return;
    }


    const day =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const year =
        Number(parts[2]);


    if (
        day < 1 ||
        day > 31 ||
        month < 1 ||
        month > 12 ||
        year < 1
    ) {

        showError(
            "Please enter a valid date."
        );

        return;
    }


    const birthDate =
        new Date(
            year,
            month - 1,
            day
        );


    /* Check invalid dates like 31/02/1998 */
    if (
        birthDate.getFullYear() !== year ||
        birthDate.getMonth() !== month - 1 ||
        birthDate.getDate() !== day
    ) {

        showError(
            "This is not a valid calendar date."
        );

        return;
    }


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    if (birthDate > today) {

        showError(
            "Date of birth cannot be in the future."
        );

        return;
    }


    let years =
        today.getFullYear()
        - birthDate.getFullYear();

    let months =
        today.getMonth()
        - birthDate.getMonth();

    let days =
        today.getDate()
        - birthDate.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();
    }


    if (months < 0) {

        years--;

        months += 12;
    }


    document.getElementById(
        "years"
    ).textContent =
        years;


    document.getElementById(
        "months"
    ).textContent =
        months;


    document.getElementById(
        "days"
    ).textContent =
        days;


    document.getElementById(
        "ageMain"
    ).textContent =
        years +
        " Years, " +
        months +
        " Months, " +
        days +
        " Days";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";
}

</script>

</body>
</html>
