<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator - Free Online Tool</title>

    <meta name="description"
        content="Calculate your exact age in years, months and days with our free online age calculator.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172033;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="date"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3df;
            border-radius: 9px;
            font-size: 16px;
        }

        .calculate {
            width: 100%;
            border: none;
            background: #1769ff;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }

        .calculate:hover {
            background: #0757df;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f5f8ff;
            border-radius: 12px;
            text-align: center;
        }

        .age-main {
            font-size: 30px;
            font-weight: bold;
            color: #1769ff;
            margin-bottom: 15px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail {
            background: white;
            padding: 15px 5px;
            border-radius: 10px;
        }

        .detail strong {
            display: block;
            font-size: 22px;
        }

        .detail span {
            color: #667085;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769ff;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px auto;
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎂 Age Calculator</h1>

    <p class="description">
        Calculate your exact age in years, months and days.
    </p>

    <div class="input-group">

        <label for="birthDate">
            Date of Birth
        </label>

        <input
            type="date"
            id="birthDate"
        >

    </div>

    <button
        class="calculate"
        onclick="calculateAge()"
    >
        🧮 Calculate Age
    </button>

    <div
        class="result"
        id="result"
    >

        <div
            class="age-main"
            id="ageMain"
        >
        </div>

        <div class="details">

            <div class="detail">
                <strong id="years">0</strong>
                <span>Years</span>
            </div>

            <div class="detail">
                <strong id="months">0</strong>
                <span>Months</span>
            </div>

            <div class="detail">
                <strong id="days">0</strong>
                <span>Days</span>
            </div>

        </div>

    </div>

    <a
        class="back"
        href="../index.html"
    >
        ← Back to All Tools
    </a>

</div>


<script>

function calculateAge() {

    const birthInput =
        document.getElementById(
            "birthDate"
        ).value;

    if (!birthInput) {

        alert(
            "Please select your date of birth."
        );

        return;
    }


    const birthDate =
        new Date(
            birthInput + "T00:00:00"
        );

    const today =
        new Date();


    if (birthDate > today) {

        alert(
            "Date of birth cannot be in the future."
        );

        return;
    }


    let years =
        today.getFullYear()
        - birthDate.getFullYear();

    let months =
        today.getMonth()
        - birthDate.getMonth();

    let days =
        today.getDate()
        - birthDate.getDate();


    if (days < 0) {

        months--;

        const previousMonth =
            new Date(
                today.getFullYear(),
                today.getMonth(),
                0
            );

        days +=
            previousMonth.getDate();
    }


    if (months < 0) {

        years--;

        months += 12;
    }


    document.getElementById(
        "years"
    ).textContent =
        years;


    document.getElementById(
        "months"
    ).textContent =
        months;


    document.getElementById(
        "days"
    ).textContent =
        days;


    document.getElementById(
        "ageMain"
    ).textContent =
        years +
        " Years, " +
        months +
        " Months, " +
        days +
        " Days";


    document.getElementById(
        "result"
    ).style.display =
        "block";
}

</script>

</body>
</html>
