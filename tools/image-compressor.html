<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Compressor - Free Online Tool</title>

    <meta name="description"
        content="Compress images online for free and reduce image file size while maintaining good quality.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172033;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #667085;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #1769ff;
            border-radius: 15px;
            padding: 35px 15px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 15px;
        }

        .quality-box {
            margin: 20px 0;
        }

        .quality-box input {
            width: 100%;
        }

        button {
            border: none;
            background: #1769ff;
            color: white;
            padding: 13px 22px;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
            margin: 6px;
        }

        button:hover {
            background: #0757df;
        }

        .download {
            background: #172033;
        }

        .download:hover {
            background: #000;
        }

        #preview {
            max-width: 100%;
            max-height: 350px;
            margin: 20px auto;
            border-radius: 10px;
            display: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f8ff;
            border-radius: 10px;
            display: none;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1769ff;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px auto;
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖼️ Image Compressor</h1>

        <p class="description">
            Compress your image and reduce its file size easily.
        </p>

        <div class="upload-box">

            <h3>Select an Image</h3>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </div>

        <div class="quality-box">

            <label>
                Compression Quality:
                <strong><span id="qualityValue">70</span>%</strong>
            </label>

            <input
                type="range"
                id="quality"
                min="10"
                max="100"
                value="70"
            >

        </div>

        <button onclick="compressImage()">
            Compress Image
        </button>

        <img id="preview" alt="Compressed image preview">

        <div class="result" id="result">

            <p>
                Original Size:
                <strong id="originalSize">-</strong>
            </p>

            <p>
                Compressed Size:
                <strong id="compressedSize">-</strong>
            </p>

            <p>
                Saved:
                <strong id="savedSize">-</strong>
            </p>

            <br>

            <a id="downloadLink" download="compressed-image.jpg">
                <button class="download">
                    ⬇️ Download Image
                </button>
            </a>

        </div>

        <a class="back" href="../index.html">
            ← Back to All Tools
        </a>

    </div>


    <script>

        const imageInput = document.getElementById("imageInput");
        const quality = document.getElementById("quality");
        const qualityValue = document.getElementById("qualityValue");

        quality.addEventListener("input", function () {
            qualityValue.textContent = quality.value;
        });


        function formatBytes(bytes) {

            if (bytes === 0) return "0 Bytes";

            const units = [
                "Bytes",
                "KB",
                "MB",
                "GB"
            ];

            const i = Math.floor(
                Math.log(bytes) / Math.log(1024)
            );

            return (
                parseFloat(
                    (bytes / Math.pow(1024, i)).toFixed(2)
                )
                + " "
                + units[i]
            );
        }


        function compressImage() {

            const file = imageInput.files[0];

            if (!file) {
                alert("Please select an image first.");
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {

                const img = new Image();

                img.onload = function () {

                    const canvas = document.createElement("canvas");

                    canvas.width = img.width;
                    canvas.height = img.height;

                    const ctx = canvas.getContext("2d");

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        img.width,
                        img.height
                    );

                    const imageQuality =
                        Number(quality.value) / 100;

                    canvas.toBlob(
                        function (blob) {

                            if (!blob) {
                                alert("Compression failed.");
                                return;
                            }

                            const compressedURL =
                                URL.createObjectURL(blob);

                            document.getElementById(
                                "preview"
                            ).src = compressedURL;

                            document.getElementById(
                                "preview"
                            ).style.display = "block";


                            document.getElementById(
                                "originalSize"
                            ).textContent =
                                formatBytes(file.size);


                            document.getElementById(
                                "compressedSize"
                            ).textContent =
                                formatBytes(blob.size);


                            const saved =
                                file.size - blob.size;

                            document.getElementById(
                                "savedSize"
                            ).textContent =
                                saved > 0
                                ? formatBytes(saved)
                                : "No size reduction";


                            const downloadLink =
                                document.getElementById(
                                    "downloadLink"
                                );

                            downloadLink.href =
                                compressedURL;


                            document.getElementById(
                                "result"
                            ).style.display = "block";

                        },
                        "image/jpeg",
                        imageQuality
                    );

                };

                img.src = event.target.result;

            };

            reader.readAsDataURL(file);
        }

    </script>

</body>
</html>
