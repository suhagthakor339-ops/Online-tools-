<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator - Free Online Tool</title>

    <meta name="description"
        content="Calculate your monthly loan EMI, total interest and total payment using our free EMI calculator.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8ff;
            color: #172033;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3df;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1769ff;
        }

        .calculate {
            width: 100%;
            border: none;
            background: #1769ff;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 17px;
            cursor: pointer;
        }

        .calculate:hover {
            background: #0757df;
        }

        .result {
            display: none;
            margin-top: 25px;
        }

        .emi-main {
            background: #f5f8ff;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .emi-main span {
            display: block;
            color: #667085;
            margin-bottom: 8px;
        }

        .emi-main strong {
            font-size: 32px;
            color: #1769ff;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            background: #f5f8ff;
            padding: 18px 10px;
            border-radius: 10px;
            text-align: center;
        }

        .detail strong {
            display: block;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .detail span {
            color: #667085;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769ff;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px auto;
                padding: 25px 15px;
            }

            h1 {
                font-size: 25px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 EMI Calculator</h1>

    <p class="description">
        Calculate your monthly loan EMI, interest and total payment.
    </p>

    <div class="input-group">

        <label for="loanAmount">
            Loan Amount (₹)
        </label>

        <input
            type="number"
            id="loanAmount"
            placeholder="Example: 500000"
            min="1"
        >

    </div>


    <div class="input-group">

        <label for="interestRate">
            Annual Interest Rate (%)
        </label>

        <input
            type="number"
            id="interestRate"
            placeholder="Example: 8.5"
            min="0"
            step="0.01"
        >

    </div>


    <div class="input-group">

        <label for="loanYears">
            Loan Tenure (Years)
        </label>

        <input
            type="number"
            id="loanYears"
            placeholder="Example: 5"
            min="1"
            step="1"
        >

    </div>


    <button
        class="calculate"
        onclick="calculateEMI()"
    >
        🧮 Calculate EMI
    </button>


    <div
        class="result"
        id="result"
    >

        <div class="emi-main">

            <span>
                Monthly EMI
            </span>

            <strong id="monthlyEMI">
                ₹0
            </strong>

        </div>


        <div class="details">

            <div class="detail">

                <strong id="principal">
                    ₹0
                </strong>

                <span>
                    Principal Amount
                </span>

            </div>


            <div class="detail">

                <strong id="interest">
                    ₹0
                </strong>

                <span>
                    Total Interest
                </span>

            </div>


            <div class="detail">

                <strong id="totalPayment">
                    ₹0
                </strong>

                <span>
                    Total Payment
                </span>

            </div>


            <div class="detail">

                <strong id="months">
                    0
                </strong>

                <span>
                    Total Months
                </span>

            </div>

        </div>

    </div>


    <a
        class="back"
        href="../index.html"
    >
        ← Back to All Tools
    </a>

</div>


<script>

function formatRupees(amount) {

    return "₹" +
        amount.toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 0
            }
        );
}


function calculateEMI() {

    const principal =
        Number(
            document.getElementById(
                "loanAmount"
            ).value
        );

    const annualRate =
        Number(
            document.getElementById(
                "interestRate"
            ).value
        );

    const years =
        Number(
            document.getElementById(
                "loanYears"
            ).value
        );


    if (
        principal <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {

        alert(
            "Please enter valid loan details."
        );

        return;
    }


    const months =
        years * 12;


    const monthlyRate =
        annualRate / 12 / 100;


    let emi;


    if (monthlyRate === 0) {

        emi =
            principal / months;

    } else {

        emi =
            principal *
            monthlyRate *
            Math.pow(
                1 + monthlyRate,
                months
            )
            /
            (
                Math.pow(
                    1 + monthlyRate,
                    months
                ) - 1
            );
    }


    const totalPayment =
        emi * months;


    const totalInterest =
        totalPayment - principal;


    document.getElementById(
        "monthlyEMI"
    ).textContent =
        formatRupees(emi);


    document.getElementById(
        "principal"
    ).textContent =
        formatRupees(principal);


    document.getElementById(
        "interest"
    ).textContent =
        formatRupees(totalInterest);


    document.getElementById(
        "totalPayment"
    ).textContent =
        formatRupees(totalPayment);


    document.getElementById(
        "months"
    ).textContent =
        months;


    document.getElementById(
        "result"
    ).style.display =
        "block";
}

</script>

</body>
</html>
